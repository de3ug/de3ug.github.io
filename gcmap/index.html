<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Circle Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+zZ9cM0ybHfWDbb0MEGL3jR0iOHAJ0uCDU9I1A9ZM=" crossorigin=""/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 60vh; }
    .toast { position: fixed; top: 1rem; right: 1rem; background: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.25rem; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Great Circle Mapper</h1>
    <div class="flex mb-4 gap-2">
      <input id="route-input" class="border p-2 flex-grow" placeholder="Enter route e.g. SEA-LHR or 8000nm@LHR" />
      <button id="draw-btn" class="bg-blue-500 text-white px-4 py-2">Draw</button>
    </div>
    <div id="map" class="mb-4"></div>
    <table id="results" class="table-auto w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-200">
          <th class="p-2">Leg</th>
          <th class="p-2">Distance (nm)</th>
          <th class="p-2">mi</th>
          <th class="p-2">km</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1jUOdXwWYkFuk9y4nUMHb11tRzO9ztUDsH0h6rdw=" crossorigin=""></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
