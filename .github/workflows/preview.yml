name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tidy if needed
        run: |
          if ! command -v tidy >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tidy
          fi
      - name: Validate HTML
        run: |
          fail=0
          for f in $(find site -name '*.html'); do
            set +e
            tidy -qe "$f"
            rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then fail=1; fi
          done
          exit $fail
      - name: gcmap unit tests
        run: node site/gcmap/test.js
      - name: JS smoke test
        run: node smoke.js
      - name: Copy site to dist
        run: |
          mkdir -p dist
          cp -r site/* dist/
      - name: PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          action: remove
