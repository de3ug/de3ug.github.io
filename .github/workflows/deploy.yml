name: Deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tidy if needed
        run: |
          if ! command -v tidy >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tidy
          fi
      - name: Validate HTML
        run: |
          fail=0
          for f in $(find site -name '*.html'); do
            set +e
            tidy -qe "$f"
            rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then fail=1; fi
          done
          exit $fail
      - name: gcmap unit tests
        run: node site/gcmap/test.js
      - name: JS smoke test
        run: node smoke.js
      - name: Copy site to dist
        run: |
          mkdir -p dist
          cp -r site/* dist/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
